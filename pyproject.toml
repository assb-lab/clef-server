[project]
name = "clef-workspace"
version = "0.1.0"
description = "Clef inference server and client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["clef-server", "clef-client"]

[tool.uv]
package = false

[tool.uv.sources]
clef-server = { workspace = true }
clef-client = { workspace = true }

[tool.uv.workspace]
members = ["server", "client"]
